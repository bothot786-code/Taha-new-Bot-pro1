<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priyanshu FB Bot - README Preview</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #b400ff;
            --neon-pink: #ff00aa;
            --neon-green: #00ff88;
            --neon-orange: #ff6b00;
            --dark-bg: #0a0a0f;
            --card-bg: #12121a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--dark-bg);
            font-family: 'Inter', sans-serif;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        /* ==================== INTRO OVERLAY ==================== */
        #intro-overlay {
            position: fixed;
            inset: 0;
            background: var(--dark-bg);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .intro-container {
            position: relative;
            text-align: center;
            z-index: 10;
        }

        /* Matrix rain effect */
        .matrix-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
            opacity: 0.3;
        }

        .matrix-column {
            position: absolute;
            top: -100%;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            animation: matrixFall linear infinite;
            writing-mode: vertical-rl;
        }

        @keyframes matrixFall {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(calc(100vh + 100%));
            }
        }

        /* Intro logo */
        .intro-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            position: relative;
            animation: iconPulse 2s ease-in-out infinite;
        }

        .intro-icon::before {
            content: '🤖';
            font-size: 80px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 30px var(--neon-blue));
        }

        .intro-icon-ring {
            position: absolute;
            inset: -10px;
            border: 3px solid transparent;
            border-top-color: var(--neon-blue);
            border-radius: 50%;
            animation: ringRotate 1.5s linear infinite;
        }

        .intro-icon-ring:nth-child(2) {
            inset: -20px;
            border-top-color: var(--neon-purple);
            animation-duration: 2s;
            animation-direction: reverse;
        }

        .intro-icon-ring:nth-child(3) {
            inset: -30px;
            border-top-color: var(--neon-pink);
            animation-duration: 2.5s;
        }

        @keyframes iconPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        @keyframes ringRotate {
            to {
                transform: rotate(360deg);
            }
        }

        .intro-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 900;
            margin-bottom: 15px;
            opacity: 0;
            animation: titleReveal 1s ease-out 0.5s forwards;
        }

        .intro-title span {
            display: inline-block;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple), var(--neon-pink));
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientMove 3s ease infinite;
        }

        @keyframes titleReveal {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.9);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes gradientMove {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .intro-tagline {
            font-size: 1.2rem;
            color: #888;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1s forwards;
        }

        .intro-version {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 20px;
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.1), rgba(180, 0, 255, 0.1));
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 50px;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            color: var(--neon-green);
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1.3s forwards;
        }

        .intro-loader {
            margin-top: 50px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1.6s forwards;
        }

        .loader-text {
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
        }

        .loader-bar-container {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin: 0 auto;
        }

        .loader-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple), var(--neon-pink), var(--neon-green));
            background-size: 300% 100%;
            border-radius: 10px;
            animation: loaderFill 2.5s ease-out 2s forwards, loaderGradient 1s linear infinite;
        }

        @keyframes loaderFill {
            to {
                width: 100%;
            }
        }

        @keyframes loaderGradient {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 100% 50%;
            }
        }

        .loader-status {
            margin-top: 15px;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: var(--neon-green);
            opacity: 0;
            animation: blink 0.5s step-end infinite, fadeUp 0.5s ease-out 2.2s forwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes blink {
            50% {
                opacity: 0.5;
            }
        }

        /* Floating particles in intro */
        .intro-particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .intro-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: particleFloat 4s ease-in-out infinite;
        }

        @keyframes particleFloat {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* ==================== MAIN CONTENT ==================== */
        #main-content {
            opacity: 0;
            display: none;
            min-height: 100vh;
        }

        /* Animated background */
        .animated-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: orbFloat 20s ease-in-out infinite;
        }

        .bg-orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(0, 243, 255, 0.15);
            top: 10%;
            left: 10%;
        }

        .bg-orb-2 {
            width: 500px;
            height: 500px;
            background: rgba(180, 0, 255, 0.12);
            top: 50%;
            right: 10%;
            animation-delay: -5s;
        }

        .bg-orb-3 {
            width: 350px;
            height: 350px;
            background: rgba(255, 0, 170, 0.1);
            bottom: 10%;
            left: 30%;
            animation-delay: -10s;
        }

        @keyframes orbFloat {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            25% {
                transform: translate(50px, -30px) scale(1.1);
            }

            50% {
                transform: translate(-30px, 50px) scale(0.9);
            }

            75% {
                transform: translate(-50px, -20px) scale(1.05);
            }
        }

        /* Grid pattern */
        .grid-pattern {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transform: translateY(-100%);
            animation: headerSlide 0.6s ease-out 0.3s forwards;
        }

        @keyframes headerSlide {
            to {
                transform: translateY(0);
            }
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo-icon {
            font-size: 1.8rem;
        }

        .header-logo-text {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-badge {
            padding: 5px 15px;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.1), rgba(0, 255, 136, 0.05));
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 50px;
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            color: var(--neon-green);
        }

        /* README Container */
        .readme-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 120px 30px 60px;
            position: relative;
            z-index: 1;
        }

        /* Markdown Styles */
        .markdown-body {
            line-height: 1.8;
        }

        .markdown-body h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0;
            animation: slideInLeft 0.8s ease-out forwards;
            position: relative;
        }

        .markdown-body h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            border-radius: 2px;
            animation: lineGrow 1s ease-out 0.5s forwards;
            transform-origin: left;
            transform: scaleX(0);
        }

        @keyframes lineGrow {
            to {
                transform: scaleX(1);
            }
        }

        .markdown-body h1+p {
            font-size: 1.2rem;
            color: #888;
            font-style: italic;
            margin-bottom: 30px;
            opacity: 0;
            animation: slideInLeft 0.8s ease-out 0.2s forwards;
        }

        .markdown-body h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            margin: 60px 0 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(0, 243, 255, 0.2);
            color: var(--neon-blue);
            opacity: 0;
            transform: translateX(-30px);
        }

        .markdown-body h2.visible {
            animation: slideInLeft 0.6s ease-out forwards;
        }

        .markdown-body h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            margin: 35px 0 15px;
            color: var(--neon-purple);
            opacity: 0;
            transform: translateX(-20px);
        }

        .markdown-body h3.visible {
            animation: slideInLeft 0.5s ease-out forwards;
        }

        @keyframes slideInLeft {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .markdown-body p {
            margin-bottom: 20px;
            color: #c0c0c0;
        }

        .markdown-body strong {
            color: #fff;
            font-weight: 600;
        }

        .markdown-body em {
            color: #aaa;
        }

        .markdown-body a {
            color: var(--neon-blue);
            text-decoration: none;
            position: relative;
            transition: all 0.3s;
        }

        .markdown-body a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--neon-blue);
            transition: width 0.3s;
        }

        .markdown-body a:hover::after {
            width: 100%;
        }

        .markdown-body a:hover {
            color: var(--neon-pink);
            text-shadow: 0 0 10px rgba(255, 0, 170, 0.5);
        }

        /* Blockquotes */
        .markdown-body blockquote {
            margin: 25px 0;
            padding: 20px 25px;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.05), rgba(0, 255, 136, 0.02));
            border-left: 4px solid var(--neon-green);
            border-radius: 0 10px 10px 0;
            position: relative;
            overflow: hidden;
        }

        .markdown-body blockquote::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, rgba(0, 255, 136, 0.1), transparent);
            animation: shimmer 2s ease-in-out infinite;
        }

        @keyframes shimmer {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        .markdown-body blockquote p {
            margin: 0;
            position: relative;
            z-index: 1;
        }

        /* Code blocks */
        .markdown-body code {
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            padding: 3px 8px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 5px;
            color: var(--neon-green);
        }

        .markdown-body pre {
            margin: 25px 0;
            padding: 0;
            background: #0d1117;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0, 243, 255, 0.15);
            position: relative;
            opacity: 0;
            transform: translateY(20px);
        }

        .markdown-body pre.visible {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .markdown-body pre::before {
            content: '';
            display: block;
            height: 40px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .markdown-body pre::after {
            content: '';
            position: absolute;
            top: 14px;
            left: 15px;
            width: 12px;
            height: 12px;
            background: #ff5f56;
            border-radius: 50%;
            box-shadow: 20px 0 0 #ffbd2e, 40px 0 0 #27c93f;
        }

        .markdown-body pre code {
            display: block;
            padding: 20px 25px;
            background: transparent;
            border: none;
            overflow-x: auto;
            color: var(--neon-green);
        }

        /* Tables */
        .markdown-body table {
            width: 100%;
            margin: 25px 0;
            border-collapse: collapse;
            background: rgba(18, 18, 26, 0.8);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0, 243, 255, 0.1);
            opacity: 0;
            transform: translateY(20px);
        }

        .markdown-body table.visible {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .markdown-body th {
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.15), rgba(180, 0, 255, 0.1));
            padding: 15px 20px;
            text-align: left;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid rgba(0, 243, 255, 0.2);
        }

        .markdown-body td {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.3s;
        }

        .markdown-body tr:hover td {
            background: rgba(0, 243, 255, 0.03);
        }

        .markdown-body tr:last-child td {
            border-bottom: none;
        }

        /* Lists */
        .markdown-body ul,
        .markdown-body ol {
            margin: 20px 0;
            padding-left: 25px;
        }

        .markdown-body li {
            margin: 12px 0;
            padding-left: 10px;
            position: relative;
        }

        .markdown-body ul li::marker {
            color: var(--neon-purple);
        }

        .markdown-body ol li::marker {
            color: var(--neon-blue);
            font-weight: 600;
        }

        /* Horizontal rules */
        .markdown-body hr {
            margin: 50px 0;
            border: none;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.3), rgba(180, 0, 255, 0.3), transparent);
            position: relative;
        }

        .markdown-body hr::before {
            content: '◆';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: var(--dark-bg);
            padding: 0 20px;
            color: var(--neon-purple);
            font-size: 0.8rem;
        }

        /* Image styling for social icons */
        .markdown-body img {
            max-width: 100%;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .markdown-body table img {
            width: 48px !important;
            height: 48px !important;
            transition: all 0.3s;
        }

        .markdown-body table img:hover {
            transform: scale(1.2);
            filter: drop-shadow(0 0 15px var(--neon-blue));
        }

        /* Center aligned content */
        .markdown-body p[align="center"],
        .markdown-body table[align="center"] {
            text-align: center;
        }

        /* Scroll to top button */
        .scroll-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all 0.3s;
            z-index: 1000;
            box-shadow: 0 5px 25px rgba(0, 243, 255, 0.3);
        }

        .scroll-top.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .scroll-top:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 10px 40px rgba(0, 243, 255, 0.5);
        }

        /* Progress bar */
        .reading-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple), var(--neon-pink));
            z-index: 10001;
            width: 0%;
            transition: width 0.1s;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 40px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 60px;
        }

        .footer-text {
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            color: #666;
        }

        .footer-text span {
            color: var(--neon-green);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .markdown-body h1 {
                font-size: 2rem;
            }

            .markdown-body h2 {
                font-size: 1.4rem;
            }

            .header {
                padding: 12px 20px;
            }

            .readme-container {
                padding: 100px 20px 40px;
            }

            .intro-title {
                font-size: 1.8rem;
            }

            .markdown-body table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>
    <!-- Reading Progress -->
    <div class="reading-progress" id="reading-progress"></div>

    <!-- Intro Overlay -->
    <div id="intro-overlay">
        <!-- Matrix Background -->
        <div class="matrix-bg" id="matrix-bg"></div>

        <!-- Particles -->
        <div class="intro-particles" id="intro-particles"></div>

        <!-- Intro Content -->
        <div class="intro-container">
            <div class="intro-icon">
                <div class="intro-icon-ring"></div>
                <div class="intro-icon-ring"></div>
                <div class="intro-icon-ring"></div>
            </div>
            <h1 class="intro-title"><span>PRIYANSHU FB BOT</span></h1>
            <p class="intro-tagline">Professional-Grade Messenger Automation</p>
            <div class="intro-version">v2.0 • 140+ Commands • MongoDB Powered</div>

            <div class="intro-loader">
                <div class="loader-text">Initializing README Preview...</div>
                <div class="loader-bar-container">
                    <div class="loader-bar"></div>
                </div>
                <div class="loader-status">Loading documentation...</div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content">
        <!-- Animated Background -->
        <div class="animated-bg">
            <div class="bg-orb bg-orb-1"></div>
            <div class="bg-orb bg-orb-2"></div>
            <div class="bg-orb bg-orb-3"></div>
        </div>
        <div class="grid-pattern"></div>

        <!-- Header -->
        <header class="header">
            <div class="header-logo">
                <span class="header-logo-icon">🤖</span>
                <span class="header-logo-text">README.md</span>
            </div>
            <div class="header-badge">📄 Documentation</div>
        </header>

        <!-- README Content -->
        <div class="readme-container">
            <article class="markdown-body" id="markdown-content">
                <!-- Content will be loaded here -->
            </article>
        </div>

        <!-- Footer -->

_A professional-grade Facebook Messenger automation stack built for communities, admins, and power users._

---

## 🚀 Overview

**Priyanshu FB Bot** is a full-featured Messenger automation platform by **Priyanshu Rajput**.  
It runs on top of **Node.js**, **MongoDB**, and the battle-tested [\`fca-priyansh\`](https://www.npmjs.com/package/fca-priyansh) engine.  
The bot authenticates using **Facebook cookies (appstate.json)** and ships with more than **140 commands** covering moderation, engagement, AI utilities, and automation workflows.

> ✅ **Recommended reference**: see [\`DOCS.md\`](./DOCS.md) for architectural deep dives, module structure, and extension guides.

---

## ✨ Key Capabilities

| Domain | Highlights |
| --- | --- |
| Command Engine | Prefix-based + no-prefix triggers, aliases, per-command permissions, cooldowns |
| Event Automation | Joins/leaves, nicknames, thread analytics, appstate hot reload, auto-sync |
| Data Layer | MongoDB models for users, threads, currencies, anti-change, audit |
| Economy System | Levels, EXP, bank, inventory, configurable rewards |
| Admin Ops | Ban/unban users/threads, runtime updates, deployment helpers, logging |
| Web Preview | Live stats dashboard, uptime monitor, Render-ready server |
| Update Pipeline | Runtime update + \`/update full\` GitHub sync via manifest control |

---

## 🧩 Architecture at a Glance

- \`index.js\` / \`start.js\`: runtime boot + MQTT listener
- \`modules/commands\`: 140+ modular command files
- \`modules/events\`: event-driven automation
- \`handles/\`: core routers (command + reply + reaction + database sync)
- \`models/\`: Mongoose schemas (users, threads, currencies, anti-change)
- \`utils/\`: logger, loader, permissions, server, API wrappers

Dive deeper in [\`DOCS.md\`](./DOCS.md) → Sections **2–7** cover structure, handlers, database schemas, and API helpers.

---

## ⚙️ Getting Started

### Prerequisites

- **Node.js v20+** (LTS recommended)
- **MongoDB** cluster or self-hosted instance
- **Facebook account** with valid cookies (\`appstate.json\`)
- **Open inbound port** (default \`3000/3002\`) for the preview server

### Installation

\`\`\`bash
git clone https://gitlab.com/priyanshufsdev/priyanshu-fb-bot.git
cd priyanshu-fb-bot
npm install
\`\`\`

### Configuration Checklist

| File | Purpose |
| --- | --- |
| \`config.json\` | Prefix, owners/admins, Mongo URI, server toggles, GitHub sync, session scheduler |
| \`appstate.json\` | Facebook cookies (export via browser tools) |
| \`update.json\` | Manifest for runtime + \`/update full\` sync |
| \`docs/*.md\` | Extension/reference guides |

### Running Locally

\`\`\`bash
npm start          # production boot
npm run dev        # nodemon hot reload (optional script)
\`\`\`

### Deploying on Render (or any PaaS)

1. Push repo to GitHub/GitLab
2. Create Web Service → attach repository
3. Render auto-reads \`render.yaml\`
4. Set \`NODE_ENV=production\`
5. Ensure \`appstate.json\` + \`config.json\` are present (use Render disk or env injection)

> Render-friendly perks: built-in \`server\` module exposes preview, uptime ping, and environment checks.

---

## 🧠 How the Bot Operates

1. **Cookie-based Login**  
   Priyanshu FB Bot authenticates with a Facebook session exported to \`appstate.json\`.  
   - Export via browser dev tools or extensions (use the same device/browser as your usual Messenger login).  
   - Keep \`appstate.json\` private—anyone with it can hijack the bot session.

2. **Realtime MQTT Listener**  
   \`fca-priyansh\` maintains an MQTT socket to Messenger.  
   - \`sessionManagement\` in \`config.json\` refreshes cookies periodically.  
   - Hot reload is triggered whenever \`appstate.json\` changes on disk.

3. **Command + Event Pipeline**  
   - Messages flow through \`handles/handleCommand.js\`.  
   - Replies and reactions are tracked via \`global.client.replies\`/\`reactions\` for multi-step flows.  
   - Events (joins/leaves, nickname edits, etc.) emit into \`modules/events\`.

4. **Data Synchronization**  
   MongoDB models keep track of threads, users, anti-change locks, and currency stats.  
   - \`handleDatabase.js\` + \`handleCreateDatabase.js\` automatically sync new groups.  
   - \`/syncthreads\` forces a manual rescan if needed.

---

| Field | Description | Example |

> **Tip:** Whenever you change \`config.json\`, restart the bot so the new schedule/server settings take effect.

---

## 💡 Usage Highlights

### Sample Command Categories

- **Core**: \`/help\`, \`/bot\`, \`/ping\`, \`/update\`
- **Economy**: \`/daily\`, \`/bank\`, \`/work\`, \`/pay\`
- **Media + AI**: music, lyrics, downloader suites, AI chat bridge
- **Admin**: \`/admin ban user\`, \`/threadlock\`, \`/syncthreads\`, \`/runtime\`
- **Utility**: \`/prefix\`, \`/uptime\`, \`/stats\`, \`/feedback\`

### Runtime Update Flow

\`\`\`text

\`\`\`

## 📚 Documentation & Extension

- **Primary guide**: [\`DOCS.md\`](./DOCS.md)  
  - Sections 3–5 cover handler architecture, command/event templates, and reply systems.
- **Additional notes**:  
  - \`NSFW_FEATURE.md\`, \`PAGINATION_SOLUTION.md\`, \`FCA_BROADCAST_SYSTEM.md\`
- **Recommended flow** for new commands:
  1. Copy the template in \`DOCS.md\` §4.1
  2. Register under \`modules/commands/<category>/\`
  3. Use \`global.handleReply\` for interactive flows

---

## 🛡️ Security & Best Practices

- **Protect \`appstate.json\`**: treat it like a password. Rotate frequently if sharing repos.
- **Use dedicated Facebook accounts** for bots; avoid personal profiles to reduce risk of locks.
- **Lock down MongoDB** with IP whitelists or VPC peering.
- **Limit admin IDs** in \`config.json\`. Anyone listed can run owner-level commands.
- **Enable Render auth** or reverse proxies when exposing the preview dashboard publicly.

---

## 🧰 Troubleshooting

| Symptom | Possible Cause | Suggested Fix |
| --- | --- | --- |
| \`Appstate - Your Cookie Is Wrong\` | Expired or malformed \`appstate.json\` | Re-export cookies, ensure JSON array format |
| \`MessageID should be of type string\` | Host API lacks \`editMessage\` support | Bot now falls back automatically; ensure latest code |
| Mongo connection refused | Wrong \`mongoURI\` or network restrictions | Test with \`mongosh\`, update connection string |
| Preview port busy | Local port conflict | Change \`server.port\` or free port 3000/3002 |

                    text += chars[Math.floor(Math.random() * chars.length)] + ' ';
                }
                column.textContent = text;
                container.appendChild(column);
            }
        }

        // Create particles
        function createParticles() {
            const container = document.getElementById('intro-particles');
            const colors = ['#00f3ff', '#b400ff', '#ff00aa', '#00ff88'];

            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'intro-particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = (Math.random() * 100 + 100) + '%';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.animationDelay = Math.random() * 4 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                container.appendChild(particle);
            }
        }

        // Initialize
        createMatrix();
        createParticles();

        // Transition to main content
        setTimeout(() => {
            const overlay = document.getElementById('intro-overlay');
            const mainContent = document.getElementById('main-content');

            overlay.style.transition = 'opacity 1s ease-out, transform 1s ease-out';
            overlay.style.opacity = '0';
            overlay.style.transform = 'scale(1.05)';

            mainContent.style.display = 'block';

            setTimeout(() => {
                mainContent.style.transition = 'opacity 0.8s ease-out';
                mainContent.style.opacity = '1';
                overlay.style.display = 'none';

                // Parse and render markdown
                renderMarkdown();

                // Initialize scroll animations
                initScrollAnimations();
            }, 500);
        }, 5000);

        // Render markdown
        function renderMarkdown() {
            const container = document.getElementById('markdown-content');
            container.innerHTML = marked.parse(readmeContent);
        }

        // Scroll animations
        function initScrollAnimations() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

            // Observe elements
            document.querySelectorAll('.markdown-body h2, .markdown-body h3, .markdown-body pre, .markdown-body table').forEach(el => {
                observer.observe(el);
            });
        }

        // Scroll to top button
        const scrollTopBtn = document.getElementById('scroll-top');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 500) {
                scrollTopBtn.classList.add('visible');
            } else {
                scrollTopBtn.classList.remove('visible');
            }

            // Update progress bar
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('reading-progress').style.width = scrolled + '%';
        });

        scrollTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
